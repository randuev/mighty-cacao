<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout cancelled — Mighty Cacao</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --cocoa-900:#2e1a10; --cocoa-500:#6f4e37; --copper:#b0653a; --cream:#f7efe3; --paper:#fffaf1; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"DM Sans",system-ui,sans-serif; background:var(--cream); color:var(--cocoa-900); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
  .card { background:var(--paper); border-radius:18px; box-shadow:0 20px 60px rgba(46,26,16,.18); max-width:440px; width:100%; padding:2.5rem 2.2rem; text-align:center; }
  .mark { font-size:3.2rem; margin-bottom:.4rem; }
  h1 { font-family:"Fraunces",serif; font-size:1.6rem; margin-bottom:.6rem; }
  p { color:var(--cocoa-500); margin-bottom:.5rem; }
  .btn { display:inline-block; margin-top:1.2rem; background:var(--cocoa-900); color:var(--cream); padding:.8rem 1.8rem; border-radius:999px; font-weight:700; text-decoration:none; }
  .btn:hover { background:#241209; }
</style>
</head>
<body>
<div class="card">
  <div class="mark">🍫</div>
  <h1>Checkout cancelled</h1>
  <p>No charge was made — your cart is exactly as you left it.</p>
  <p>Change of heart, or card hiccup? Jump back in.</p>
  <a class="btn" href="./">Back to the shelf</a>
</div>
</body>
</html>
